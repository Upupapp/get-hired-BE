name: Deploy to Linode

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Debug
        run: |
          echo "User: $LINODE_USER"
          echo "Host chars: ${#LINODE_HOST}"
          echo "Key chars: ${#LINODE_SSH_KEY}"
        env:
          LINODE_HOST: ${{ secrets.LINODE_HOST }}
          LINODE_USER: ${{ secrets.LINODE_USER }}
          LINODE_SSH_KEY: ${{ secrets.LINODE_SSH_KEY }}
      - name: Test SSH connection
        env:
          LINODE_HOST: ${{ secrets.LINODE_HOST }}
          LINODE_USER: ${{ secrets.LINODE_USER }}
          LINODE_SSH_KEY: ${{ secrets.LINODE_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$LINODE_SSH_KEY" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$LINODE_HOST" >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no "$LINODE_USER@$LINODE_HOST" "echo SSH connection successful"
      - name: Deploy to Linode
        env:
          LINODE_HOST: ${{ secrets.LINODE_HOST }}
          LINODE_USER: ${{ secrets.LINODE_USER }}
          LINODE_SSH_KEY: ${{ secrets.LINODE_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$LINODE_SSH_KEY" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$LINODE_HOST" >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no "$LINODE_USER@$LINODE_HOST" << 'ENDSSH'
            echo "=== SERVER IDENTITY ==="
            whoami
            id
            hostname

            cd /var/www/_work/get-hired-BE || exit 1

            echo "=== REPOSITORY ==="
            pwd
            git rev-parse HEAD || true
            git status --short || true

            echo "=== OWNERSHIP ==="
            stat -c '%U:%G %a %n' . .git .git/objects || true
            test -w .git/objects \
              && echo "GIT_OBJECTS=WRITABLE" \
              || echo "GIT_OBJECTS=NOT_WRITABLE"

            echo "=== NON-CURRENT-USER GIT OWNERSHIP SAMPLE ==="
            find .git ! -user "$(whoami)" -printf '%u:%g %m %p\n' 2>/dev/null | head -50 || true

            echo "=== PM2 CURRENT USER ==="
            pm2 list || true

            echo "=== PM2 SANITIZED PROCESS DATA ==="
            pm2 jlist 2>/dev/null | node -e "
            let d='';
            process.stdin.on('data',c=>d+=c);
            process.stdin.on('end',()=>{
              try {
                const rows=JSON.parse(d).map(p=>({
                  name:p.name,
                  pid:p.pid,
                  status:p.pm2_env?.status,
                  cwd:p.pm2_env?.pm_cwd,
                  script:p.pm2_env?.pm_exec_path
                }));
                console.log(JSON.stringify(rows,null,2));
              } catch(e) {
                console.log('Unable to parse PM2 list');
              }
            });
            " || true

            echo "=== SUDO CAPABILITY ==="
            sudo -n true 2>/dev/null && echo "SUDO_NOPASSWD=YES" || echo "SUDO_NOPASSWD=NO"

            echo "=== PM2 BINARY ==="
            command -v pm2 || true

            echo "=== PM2/NODE PROCESS OWNERS (with start time) ==="
            ps -eo user,pid,ppid,lstart,cmd | grep -E '[P]M2|[n]ode' || true

            echo "=== LISTENING NODE PORTS ==="
            ss -ltnp 2>/dev/null | grep -E 'node|pm2' || true

            echo "=== ROOT PM2 CHECK (sanitized: name/pid/status/cwd/script/instances only) ==="
            if sudo -n true 2>/dev/null; then
              PM2_BIN="$(command -v pm2)"
              sudo -n -u root env PM2_HOME=/root/.pm2 "$PM2_BIN" jlist 2>/dev/null | node -e "
                let d='';process.stdin.on('data',c=>d+=c);
                process.stdin.on('end',()=>{
                  try {
                    const rows = JSON.parse(d).map(p => ({
                      name: p.name, pid: p.pid, status: p.pm2_env && p.pm2_env.status,
                      cwd: p.pm2_env && p.pm2_env.pm_cwd, script: p.pm2_env && p.pm2_env.pm_exec_path,
                      instances: p.pm2_env && p.pm2_env.instances
                    }));
                    console.log(JSON.stringify(rows, null, 2));
                  } catch (e) { console.log('root pm2 jlist parse failed'); }
                });
              " || echo "ROOT_PM2_QUERY_FAILED"
            else
              echo "SKIPPED: no passwordless sudo"
            fi

            echo "=== SERVER SOURCE SNAPSHOT ==="
            git rev-parse HEAD
            git status --short
            git diff --name-status
            git diff --stat
            git diff --check || true

            echo "=== MODIFIED FILE HASHES ==="
            git diff --name-only | while read -r f; do
              [ -f "$f" ] && sha256sum "$f"
            done

            echo "=== .env.example CHANGE SUMMARY (keys only, values redacted) ==="
            if git diff --name-only | grep -qx '.env.example'; then
              sha256sum .env.example
              echo "changed keys:"
              git diff .env.example | grep -E '^[+-][A-Za-z_][A-Za-z0-9_]*=' | sed -E 's/=.*/=<REDACTED>/' | sort -u
            else
              echo ".env.example: not modified"
            fi

            echo "=== CODE-FILE DIFFS (application code only -- no artifact-retrieval channel available, printed here instead) ==="
            for f in controllers/applicantsController.js controllers/applicationController.js controllers/companiesController.js controllers/contactsController.js controllers/cvBuilderController.js controllers/jobsController.js controllers/userController.js db/job_ddl.sql helpers/videoValidator.js; do
              echo "--- DIFF: $f ---"
              git diff -- "$f" || true
            done

            echo "=== END DIAGNOSTICS ==="

            # Keep the real deploy fail-fast:
            set -e
            cd /var/www/_work/get-hired-BE

            # BUGFIX (production, "[PM2][ERROR] Process or Namespace gethired
            # not found"): PM2 keeps a separate process list per OS user (its
            # own daemon under $PM2_HOME), and gethired has always been
            # running under root's PM2 -- the "ROOT PM2 CHECK" diagnostic
            # above already confirmed this. This deploy SSHes in as a
            # non-root user, so plain `pm2 restart gethired` was hitting that
            # user's own EMPTY pm2 list and failing every time. pm2_cmd
            # resolves once here to whichever PM2 instance actually has
            # gethired, so pre-deploy state, restart, save, and post-restart
            # verification below all agree on the same target instead of
            # each guessing separately.
            echo "=== DIAG: locate gethired PM2 process ==="
            # The deploy user has no blanket passwordless sudo (confirmed via
            # the SUDO CAPABILITY diagnostic above) -- `sudo -n -u root env
            # PM2_HOME=... pm2` is denied outright. /usr/local/bin/gethired-pm2
            # is a narrow wrapper (sets PM2_HOME=/root/.pm2, execs the real
            # pm2 binary) that the deploy user IS granted passwordless sudo
            # for specifically, via /etc/sudoers.d/gethired-pm2-deploy -- see
            # GETHIRED_LINODE_CLEAN_CHECKOUT_CUTOVER_RUNBOOK.md for how that
            # was provisioned. Falls back to a plain `pm2` check first in
            # case gethired is ever migrated to run as this deploy user
            # directly (removing the need for the wrapper entirely).
            # PM2_BIN_CMD is the full command that stands in for `pm2` --
            # NOT a prefix pm2 gets appended to (the wrapper already execs
            # the real pm2 binary internally, so appending "pm2" again would
            # pass it as a bogus first argument).
            if pm2 jlist 2>/dev/null | grep -q '"name":"gethired"'; then
              echo "gethired found under current user's PM2"
              PM2_BIN_CMD="pm2"
            elif sudo -n /usr/local/bin/gethired-pm2 jlist 2>/dev/null | grep -q '"name":"gethired"'; then
              echo "gethired found under root's PM2 -- managing via the gethired-pm2 sudo wrapper"
              PM2_BIN_CMD="sudo -n /usr/local/bin/gethired-pm2"
            else
              echo "FATAL: gethired not found under current user's PM2, and the gethired-pm2 sudo wrapper is missing/denied/found nothing"
              exit 1
            fi
            pm2_cmd() { eval "${PM2_BIN_CMD} \"\$@\""; }

            echo "=== DIAG: pre-deploy state ==="
            git rev-parse HEAD
            pm2_cmd jlist | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{try{const p=JSON.parse(d).find(x=>x.name==='gethired');console.log(p?('gethired BEFORE: pid='+p.pid+' status='+p.pm2_env.status+' restarts='+p.pm2_env.restart_time+' uptime_ms='+(Date.now()-p.pm2_env.pm_uptime)):'gethired: NOT FOUND IN PM2 LIST')}catch(e){console.log('pm2 jlist parse failed:', e.message)}})"

            echo "=== DIAG: git update ==="
            git fetch origin main
            git reset --hard origin/main
            git clean -fd
            echo "post-reset HEAD: $(git rev-parse HEAD)"

            echo "=== DIAG: reclaim node_modules ownership if root-contaminated ==="
            # BUGFIX (production, "npm ci fails with EACCES on node_modules/.bin"):
            # an earlier manual `npm install`/pm2 run as root left node_modules
            # owned by root while this deploy SSHes in as a non-root user --
            # npm ci's own cleanup phase then can't rmdir/recreate .bin and the
            # whole deploy silently never reaches the restart step. .git stays
            # correctly owned (git reset --hard above already proves that), so
            # this is scoped to node_modules specifically, same root-ownership
            # contamination pattern as the 2026-08-27 outage.
            if [ -d node_modules ] && [ "$(stat -c '%U' node_modules)" != "$(whoami)" ]; then
              echo "node_modules owned by $(stat -c '%U' node_modules), not $(whoami) -- reclaiming"
              if sudo -n true 2>/dev/null; then
                sudo -n chown -R "$(whoami):$(whoami)" node_modules
                echo "node_modules ownership reclaimed via sudo"
              else
                echo "no passwordless sudo -- removing node_modules so npm ci recreates it cleanly"
                rm -rf node_modules || {
                  echo "FATAL: node_modules is root-owned, sudo is unavailable, and rm -rf failed."
                  echo "One-time manual fix required on the server (as root):"
                  echo "  chown -R $(whoami):$(whoami) /var/www/_work/get-hired-BE/node_modules"
                  exit 1
                }
              fi
            fi

            echo "=== DIAG: install/build ==="
            npm ci --omit=dev
            npm run build --if-present
            npm run migrate --if-present

            echo "=== DIAG: restart ==="
            pm2_cmd restart gethired --update-env
            pm2_cmd save

            echo "=== DIAG: post-restart verification ==="
            sleep 3
            pm2_cmd jlist | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{try{const p=JSON.parse(d).find(x=>x.name==='gethired');if(!p){console.log('gethired: NOT FOUND IN PM2 LIST AFTER RESTART');process.exit(1)};console.log('gethired AFTER: pid='+p.pid+' status='+p.pm2_env.status+' restarts='+p.pm2_env.restart_time+' uptime_ms='+(Date.now()-p.pm2_env.pm_uptime));if(p.pm2_env.status!=='online'){console.log('FATAL: process not online after restart');process.exit(1)}}catch(e){console.log('pm2 jlist parse failed:', e.message);process.exit(1)}})"

            echo "=== DIAG: local health check (informational only -- port assumed, not verified) ==="
            curl -s -o /dev/null -w "local health check HTTP status: %{http_code}\n" --max-time 10 http://127.0.0.1:3000/api/auth/signin -X POST -H "Content-Type: application/json" -d '{}' || echo "local health check request itself failed (informational, not fatal)"

            echo "=== DEPLOY VERIFIED: HEAD=$(git rev-parse HEAD) ==="
          ENDSSH